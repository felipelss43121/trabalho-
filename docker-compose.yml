version: "3.9"

services:
  # -----------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: efisco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-efisco_analitico}
      POSTGRES_USER: ${DB_USER:-efisco_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-efisco_senha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-efisco_user} -d ${DB_NAME:-efisco_analitico}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Coletor: execução única (coleta + exportação)
  # -----------------------------------------------------------------------
  coletor:
    build: .
    container_name: efisco_coletor
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    profiles:
      - coleta

  # -----------------------------------------------------------------------
  # Agendador: serviço contínuo com disparo diário
  # -----------------------------------------------------------------------
  agendador:
    build: .
    container_name: efisco_agendador
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
    command: ["python", "scheduler/agendador.py", "--hora", "6", "--minuto", "0"]
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    restart: unless-stopped
    profiles:
      - agendador

volumes:
  postgres_data:
    driver: local
